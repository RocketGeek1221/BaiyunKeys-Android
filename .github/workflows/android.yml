name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定资产名：README 里的下载按钮指向这个文件名，改名会让链接失效
  APK_NAME: BaiyunKeys-Android.apk
  # v1.0.2 起的固定签名证书指纹（apksigner verify --print-certs 的 SHA-256，小写）。
  # 与 signing/ 里的 keystore 必须一致；换了钥匙就同步改这里和 Secrets。
  EXPECTED_CERT_SHA256: 7b798950fda05ad0e97a7a3beb19f7006b58c09f3ba2969787b40f4636cfd05d

jobs:
  # ── 1. 单测 + lint + 构建 ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：它内部会跑 `sdkmanager tools`，
      # 而 Google 已移除 legacy `tools` 包（Failed to find package 'tools' 后 exit 1）。
      # GitHub 的 ubuntu 镜像自带 Android SDK，这里只补装本项目需要的组件。
      - name: 准备 Android SDK 组件
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "使用 sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      # core 是纯 JVM 模块：协议 golden vectors 全在这里对拍，比装模拟器快得多
      - name: 协议层单测（golden vectors）
        run: ./gradlew :core:test --console=plain --stacktrace

      - name: lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: 导入签名材料
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 —— 拒绝用随机 debug key 发版"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
          echo "keystore: $(stat -c%s "$RUNNER_TEMP/signing/release.jks") bytes"

      # 发布产物走 release 构建：debug 与 release 共用同一把固定钥匙，
      # 但 release 是更正式的那条线，避免渠道之间证书不一致。
      - name: 构建发布 APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      # PR 拿不到 Secrets，只构建 debug 包做冒烟，不发布。
      - name: 构建 debug APK（PR 冒烟）
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 校验签名指纹
        if: github.event_name != 'pull_request'
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "实际: $ACTUAL"
          echo "期望: $EXPECTED_CERT_SHA256"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::签名指纹不一致：Secrets 里的 keystore 不是这把，拒绝发版"
            exit 1
          fi

      - name: 统一 APK 文件名 + 记录 SHA-256
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"
          ls -lh dist

      - name: 清理签名材料
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" || true

      - name: 上传 APK（Actions 产物）
        uses: actions/upload-artifact@v4
        with:
          name: baiyunkeys-apk
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # ── 2. main 分支每次构建 → 滚动更新 `latest` Release ────────────────────
  # README 的下载按钮指向：
  #   https://github.com/<owner>/<repo>/releases/download/latest/BaiyunKeys-Android.apk
  # 用固定 tag `latest` 而不是 releases/latest，这样无论有没有正式版本，链接都有效。
  publish-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: baiyunkeys-apk
          path: dist

      - name: 发布 / 更新 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（main 分支自动构建）
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            由 GitHub Actions 在每次推送到 `main` 时自动构建，**不是正式版本**。

            - 提交：`${{ github.sha }}`
            - 构建时间：${{ github.event.head_commit.timestamp }}
            - 内容：固定签名（v1.0.2 起）的 release APK，可直接侧载安装
            - 与正式 Release 同一把钥匙，可互相覆盖安装

            正式版本请看 [Releases](../../releases) 里带 `v*` 标签的条目。
          files: dist/${{ env.APK_NAME }}

  # ── 3. 打 v* tag → 正式 Release ─────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK 组件
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 导入签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 —— 拒绝用随机 debug key 发版"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: 构建 release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 校验签名指纹
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "实际: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::签名指纹不一致，拒绝发版"
            exit 1
          fi

      - name: 统一 APK 文件名
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"
          ls -lh dist

      - name: 清理签名材料
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" || true

      - name: 发布正式 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # 发版说明随 tag 入库（docs/release-notes/<tag>.md）；
          # 「本版需要卸载重装 + 先备份」这种必须写死的提示不能指望自动生成
          body_path: docs/release-notes/${{ github.ref_name }}.md
          body: |
            发版说明见仓库 `docs/release-notes/${{ github.ref_name }}.md`。
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256
